# CI 门禁：先量、再改、再合。
#
# 区分常规与性能：
#   - 常规测试（test job）：每次 push/PR 都跑，秒级结束，不阻塞人。
#   - 性能测试（perf job）：只在 main 分支跑，确保没有偷偷退化。
#   - 交叉编译验证（cross job）：验证六平台纯 Go 单文件可编译。
name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: vet + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  # Windows 单独跑一遍测试。
  #
  # 起因（2026-11-21）：工作层刷盘在 Windows 上从未成功过——
  # syncFile 用 os.Open（只读句柄）调 f.Sync()，而 Windows 的
  # FlushFileBuffers 要求 GENERIC_WRITE，于是每 2 秒报一次
  # "sync …: Access is denied"。Unix 上只读 fd 能 fsync，所以
  # ubuntu 的 CI 全绿也完全看不见这个故障。
  #
  # 只要代码里有平台差异，就必须在真正的平台上跑测试，
  # 否则「测试通过」只证明了一半。
  test-windows:
    name: unit tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: test gitstore + server
        run: go test ./internal/gitstore/ ./internal/server/ -count=1

  cross:
    name: cross-compile (6 platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: compile all platforms (CGO_ENABLED=0)
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "::group::$os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o /tmp/zm-$os-$arch$ext ./cmd/zero-memcp
            echo "::endgroup::"
          done

  perf:
    name: performance regression tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: perf tests (with -tags perf)
        run: go test -tags perf ./... -count=1 -v -timeout 25m
