# CI 门禁：先量、再改、再合。
#
# 触发分三类：
#   - push 到 main / 对 main 的 PR：常规门禁。
#   - tag `v*`：发版前的全量门禁（同时会触发 release.yml 构建发布）。
#   - tag `ci-*`：只跑测试、不发布。用来对任意一个提交做一次完整体检。
#
# 区分常规与性能：
#   - 常规测试（test job）：每次触发都跑，秒级结束，不阻塞人。
#   - 性能测试（perf job）：main 与发版 tag 上跑，确保没有偷偷退化。
#   - 交叉编译验证（cross job）：验证六平台纯 Go 单文件可编译。
#
# Go 版本一律跟随 go.mod（go-version-file），不在 workflow 里另写一份。
# 写死过一次的代价：go.mod 要求 1.27.3 而 workflow 写着 1.24，
# 于是每次 CI 都失败在工具链版本上，跟代码毫无关系。
name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'ci-*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: vet + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 打印工具链（版本对不上时一眼看见）
        run: go version
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1

  # Windows 单独跑一遍测试。
  #
  # 起因（2026-11-21）：工作层刷盘在 Windows 上从未成功过——
  # syncFile 用 os.Open（只读句柄）调 f.Sync()，而 Windows 的
  # FlushFileBuffers 要求 GENERIC_WRITE，于是每 2 秒报一次
  # "sync …: Access is denied"。Unix 上只读 fd 能 fsync，所以
  # ubuntu 的 CI 全绿也完全看不见这个故障。
  #
  # 只要代码里有平台差异，就必须在真正的平台上跑测试，
  # 否则「测试通过」只证明了一半。
  test-windows:
    name: unit tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test gitstore + server
        run: go test ./internal/gitstore/ ./internal/server/ -count=1

  cross:
    name: cross-compile (6 platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: compile all platforms (CGO_ENABLED=0)
        run: |
          set -eu
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "::group::$os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o /tmp/zm-$os-$arch$ext ./cmd/zero-memcp
            ls -l /tmp/zm-$os-$arch$ext
            echo "::endgroup::"
          done

  perf:
    name: performance regression tests
    runs-on: ubuntu-latest
    # main 上守住退化；发版 tag 上再验一次，因为发出去的二进制不该带着退化。
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: perf tests (with -tags perf)
        run: go test -tags perf ./... -count=1 -v -timeout 25m
