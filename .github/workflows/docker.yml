name: docker

# 构建并推送 zero-memcp 官方 OCI 镜像到 GitHub Packages (GHCR)。
#
# 架构：linux/amd64, linux/arm64
# 命名：ghcr.io/open-mcp-ai/zero-memcp:vX.Y.Z 与 :latest
#
# 触发：
#   - push tag 以 'v' 开头（如 v0.1.0）
#   - workflow_dispatch（管理台手动点一次，带 release tag 参数）
#
# 继承 Termcp 的发布纪律：
#   - 预发布（-rc.X）不移动 :latest
#   - 多架构全量在 buildx 下并发产出
#   - 镜像标签严格遵循 semver

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.1.0 or manual-test)'
        required: true
        default: 'manual'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: buildx (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # -rc.X 是内部测试版，不移动 latest
          if echo "$TAG" | grep -q -- '-rc\.'; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/open-mcp-ai/zero-memcp
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
