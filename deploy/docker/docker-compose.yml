# zero-memcp 标准容器部署（macOS / Linux，amd64 / arm64）。
#
# 三个必须这样写的设计点：
#
# 1) 端口只映射到宿主回环：`127.0.0.1:1729:1729`（可用 ZERO_MEMCP_BIND 覆盖）。
#    服务在容器内必须监听 0.0.0.0（Docker 的端口转发连的是容器的 eth0，
#    连不上容器的 lo——容器内监听 127.0.0.1 时宿主机拿到的是 "Empty reply"）。
#    server 的 authposture 检查看到非回环监听就要求凭证，所以配置里需给
#    enforce_auth = true 与 require = "bearer"。
#
# 2) 本机免签降级在容器里失效（auth_middleware.go 的 isLocal() 判 RemoteAddr
#    前缀 127.0.0.1，经端口映射进来的源地址是 Docker 网关 IP）。因此所有
#    客户端都必须带 Bearer Token。
#
# 3) host.docker.internal 供容器访问宿主上的嵌入服务（如本地 Ollama）。

services:
  zero-memcp:
    image: ghcr.io/open-mcp-ai/zero-memcp:${ZERO_MEMCP_VERSION:-latest}
    container_name: zero-memcp
    restart: unless-stopped
    ports:
      - "${ZERO_MEMCP_BIND:-127.0.0.1:1729}:1729"
    volumes:
      # 数据目录是权威内容，bind mount 而非命名卷：备份/迁移就是拷这个目录。
      - ${ZERO_MEMCP_DATA:-$HOME/.zero-memcp/data}:/data
      - ${ZERO_MEMCP_CONFIG:-$HOME/.zero-memcp/zero-memcp.toml}:/etc/zero-memcp/zero-memcp.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-UTC}
