# laptop（权威节点）的容器部署。
#
# 与 backup-node 的区别，以及为什么必须这样写：
#
# 1) 端口只映射到宿主回环：`127.0.0.1:1729:1729`。
#    服务在容器内必须监听 0.0.0.0（Docker Desktop 的端口转发连的是容器的
#    eth0，连不上容器的 lo——实测把容器内监听写成 127.0.0.1 时，宿主机拿到
#    的是 "Empty reply from server"）。而 server 的 authposture 检查看到
#    非回环监听就要求凭证，所以配置里给了 require = "bearer"。
#    两者的组合是安全的：端口只有宿主回环能连，容器内那个 0.0.0.0 不是
#    对外监听面。
#
# 2) 本机免签降级在容器里失效，这不是缺陷。
#    auth_middleware.go 的 isLocal() 判的是 RemoteAddr 前缀 127.0.0.1，
#    经端口映射进来的请求源地址是 Docker 网关 IP，所以永远不是"本机"。
#    结论：容器化必然要求所有客户端带凭证——插件已带（weft/zero 两张），
#    运维脚本也已带。
#
# 3) host.docker.internal 给 embedded 用的 ollama。
#    配置里 local-ollama 的 endpoint 必须是 host.docker.internal:11434；
#    在容器里写 127.0.0.1 会指向容器自己。

services:
  zero-memcp:
    image: ghcr.io/open-mcp-ai/zero-memcp:v0.2.8
    container_name: zero-memcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:1729:1729"
    volumes:
      # 数据目录是权威内容，bind mount 而非命名卷：备份/迁移就是拷这个目录。
      - ${ZERO_MEMCP_DATA:-$HOME/.zero-memcp/data}:/data
      - ${ZERO_MEMCP_CONFIG:-$HOME/.zero-memcp/docker/zero-memcp.container.toml}:/etc/zero-memcp/zero-memcp.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
