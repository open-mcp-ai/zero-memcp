# zero-memcp 示例配置
# 
# 默认路径：~/.zero-memcp/zero-memcp.toml
# 用法：zero-memcp -config /path/to/zero-memcp.toml

[server]
# 数据根：<data>/system/ 放密钥与吊销名单，<data>/repos/<name>.git 放裸仓库
data     = "~/.zero-memcp/data"
endpoint = "local"

# enforce_auth = true 时，即使是回环地址也要求 Bearer 凭证。
# 关着的时候（默认），本机任何进程不带凭证即可被当成 root 读取全部记忆。
# 多用户机器或容器里跑服务时建议打开。
enforce_auth = false

# 定期 gc：松散对象打包（可选，服务不依赖它）
[gc]
interval = "24h"

# ── 端口策略 ──────────────────────────────────────────────────
#
# [server] listen 是主 MCP 端口，只能绑定回环地址（127.0.0.1 / ::1）。
# [[listen]] 是额外端口，允许绑定网卡地址，由 allow 列表限定能力。
# 非回环端口是明文 HTTP；生产环境应置于反向代理、Tailscale 或 WireGuard 后。
# 权限落在 socket 上，不落在代码里的 if：
# 一个端口没配写动词，它的路由里就没有写代码可走。

# 端口 1：本机全能力端口（开发机常用）
#   回环地址（127.0.0.1）在此端口上自动获得 root 权限
#   allow 必须显式写出：空列表会在启动时报错，而不是静默放开或关死
[[listen]]
addr  = "127.0.0.1:1729"
allow = ["*"]

# ── 管理台（WebUI）────────────────────────────────────────
#
# 与 Agent 通道共用同一个 http.Server，但鉴权完全分开：
# 管理台只认口令登录的会话 cookie，明确拒绝 Bearer / ?token= / Basic；
# MCP 通道路由不接受会话 cookie。
#
# 管理台一定存在，不需要开关：容器里、npm-wrapper 后面都拿不到命令行，
# 「默认关掉」等于把用户永久锁在门外。端口只决定它挂在哪儿：
#   - 单端口（不写 [[listen]]）：那个端口就是管理台入口；
#   - 多端口且没有任何端口写 webui = true：自动挂在第一个端口；
#   - 多端口且某个端口写了 webui = true：只挂在那一个上，其余端口
#     的 /、/api、/ui/* 根本不存在（404），而不是「存在但拒绝」。
# 想把管理面隔离到专用回环端口，就显式给那个端口写 webui = true。
#
# 首次启动会生成随机初始口令并打印一次到 stderr，首次登录后必须修改；
# 改口令会清空所有会话。想自己指定：启动前设 ZERO_MEMCP_UI_PASS。
# 不要把口令写进本文件：config show 会把配置原样回显给 Agent。
#
# 管理台能做：签发/吊销凭证、按 JTI+项目+分支临时放行 gated 能力位、打包对象。
#
# gated（能力门）是 cap 的一个子集：签这张凭证时就按住其中几位，
# 平时这几个位一律拒绝，直到管理台按 (项目, 分支) 临时放行其中几位。
# 比如 cap = "rwx" + gated = "x"：能读能写，但不能把记忆注入系统提示，
# 注入要临时授权；cap = "rwx" + gated = "rw"：平时只能读与注入，
# 写和改要临时授权。授权只能打开本来就被按住的位，不能凭空造出一个位。
# 开到网卡地址等于把「谁能签发凭证」交给网络，务必置于反代或 VPN 后。
#
# 下面的例子是「把管理面从主端口挪走」：主端口（1729）不再有管理路由，
# 管理面只在 1732 这个专用回环端口上。写了 webui = true 之后，
# 第一个端口就不再自动兜底了。
# [[listen]]
# addr  = "127.0.0.1:1732"
# allow = ["*"]
# webui = true

# 端口 2：HTTP Git 端点（可选）
#   供中心节点或其他设备用原生 git clone / git pull 拉取记忆
#   即使在回环地址也强制要求 Token（可走 Basic Auth 或 Bearer）
# [[listen]]
# addr  = "0.0.0.0:1730"
# allow = ["git-upload-pack"]

# 要让别的机器把历史推上来（注入一份备份、批量导入），再加 push 能力。
# 推送入口默认关闭；开放后仍然只接受快进，非快进一律拒绝。
# [[listen]]
# addr  = "0.0.0.0:1731"
# allow = ["git-upload-pack", "git-receive-pack"]

# 端口 3：受限只读 MCP 端口（可选，给非受信网络）
#   只允许查询类动词，拒绝所有写入；强制验签
# [[listen]]
# addr    = "10.10.0.0:1731"
# allow   = ["read", "ls", "recall", "grep", "log", "status"]
# require = "bearer"

# ── 用户声明 ──────────────────────────────────────────────────

[[user]]
name = "zero"
root = true

[[user]]
name   = "chat"
groups = ["agents"]

[[group]]
name    = "agents"
members = ["chat"]

# ── 项目声明（归属与默认权限）──────────────────────────────────
#
# 权限归项目，不归文件：
# 声明 Owner、Group 与 Unix 风格的 mode（rwxrwxrwx）

[[project]]
name  = "blackegg/me"
owner = "zero"
mode  = "rwx------"

[[project]]
name  = "blackegg/daily"
owner = "zero"
mode  = "rwx------"

# ── 显式授权规则 ──────────────────────────────────────────────

# 给 chat 用户只读 daily 的权限（不能读 me，也不能写 daily）
[[access]]
user    = "chat"
project = "blackegg/daily"
perm    = "r"

# [[remote]] 声明记忆仓库的远端，用于备份与多节点同步。
#
# 四条纪律：
#   • 不自动 push —— 写入只落本地，推送必须显式调用
#   • 不隐式 commit —— 有未提交内容时 push 拒绝并说明条数
#   • 不强推 —— 记忆历史只追加
#   • 冲突不静默 —— 分叉时保留两边并报错
#
# url 里不能内嵌密码：那会让它出现在 TOML、日志和错误信息三处。
# 凭证来自 git credential helper、SSH agent 或环境变量。
#
# push 是分支白名单，留空表示这个远端不可推。
# fetch_only = true
# ssh_key    = "github-deploy"   # SSH push 的服务端私钥名（root 用 remote-key put 添加）
# host_key   = "SHA256:..."       # SSH host key fingerprint 必须 pin
# http_user  = "x-access-token"  # HTTP push 的用户名（GitHub 约定）
# http_token = "gh"              # remote-secret put 保存的 token 名，不是 token 本身 表示只读镜像。
#
# [[remote]]
# project    = "blackegg/daily"
# name       = "github"
# url        = "git@github.com:private/daily.git"
# push       = ["main", "chat"]
# fetch_only = false
#
# [[remote]]
# project    = "blackegg/me"
# name       = "blackbox"
# url        = "http://10.0.0.238:1729/repos/blackegg/me.git"
# fetch_only = true
# ssh_key    = "github-deploy"   # SSH push 的服务端私钥名（root 用 remote-key put 添加）
# host_key   = "SHA256:..."       # SSH host key fingerprint 必须 pin
# http_user  = "x-access-token"  # HTTP push 的用户名（GitHub 约定）
# http_token = "gh"              # remote-secret put 保存的 token 名，不是 token 本身
