# zero-memcp 示例配置
# 
# 默认路径：~/.zero-memcp/zero-memcp.toml
# 用法：zero-memcp serve -config /path/to/zero-memcp.toml

[server]
# 数据根：<data>/system/ 放密钥与吊销名单，<data>/repos/<name>.git 放裸仓库
data     = "~/.zero-memcp/data"
endpoint = "local"

# enforce_auth = true 时，即使是回环地址也要求 Bearer 凭证。
# 关着的时候（默认），本机任何进程不带凭证即可被当成 root 读取全部记忆。
# 多用户机器或容器里跑服务时建议打开。
enforce_auth = false

# 定期 commit：控制工作层折叠成历史书签的时机（条数 或 时间，先到为准）
[commit]
interval = "30s"
count    = 100

# 定期 gc：松散对象打包（可选，服务不依赖它）
[gc]
interval = "24h"

# 后台对等同步兜底周期
[sync]
interval = "2h"
# disabled = true  # 设为 true 可完全关闭后台同步循环

# ── 索引 ──────────────────────────────────────────────────────
#
# 索引必须显式开启。**不写这一节 = 不建索引**，这台实例按冷备份运行：
#   · 启动不扫描仓库、不建倒排表、不预热正文缓存、不开语义向量
#   · 内存几十 MB、启动不到 1 秒
#   · read/ls/trees/log 照常可用（它们直接读 Git）
#   · recall/grep 调用会**明确报错**，不会静默返回空结果
#
# 什么时候关：纯备份节点。它只做三件事——收命令流、落进 Git、
# 定时折成 commit。实测在 4GB 的板子上开索引会吃掉 2.3GB 内存，
# 宿主只剩 154MB 可用。
#
# 什么时候开：任何要读要搜的节点，包括你的笔记本、agent 的工作节点。
#
# 关掉索引不影响数据完整性：Git 裸库是完整数字生命，
# 需要恢复的节点随时 git clone，或者配好这一节重新建索引。
[index]
enabled = true

# 后台建索引：进程立即开始服务，索引在后台一段一段建起来。
# status 报进度（done/total），recall 会明说「只覆盖已建好的部分」。
# 默认 true。设 false 则启动时同步建完才对外服务。
# async = true

# 按分支控制「建不建索引」。两支互斥（同一个问题不能既有白名单又有黑名单）。
# 不建索引的分支照样能 read / ls / log / grep（它们读仓库，不读索引），
# 但 recall 看不到它；显式 --scope 指名这种分支会报错，而不是回「没有命中」。
#
# 实测动机：本机 ~60,800 块里 main.chat + main.record + inbox 三条占 89%，
# 而索引体积、常驻内存、启动时间基本由它们决定。
#
# 改这两项不必重启：`config index --exclude "..."` 走 MCP，立即生效。
# exclude = ["BlackEggAI/zero@main.chat", "BlackEggAI/zero@inbox"]
# include = ["BlackEggAI/zero@ops", "*@main.fact"]

# 检索性能调优
[search]
# 正文缓存预算（MB）。默认 512。设为 0 表示禁用（省内存，但大库 grep 变慢）。
# 缓存键是 blob SHA，无失效逻辑，内容变哈希必变。
body_cache_mb = 512

# ── 端口策略 ──────────────────────────────────────────────────
#
# [[listen]] 块声明监听端口与能力白名单。
# 权限落在 socket 上，不落在代码里的 if：
# 一个端口没配写动词，它的路由里就没有写代码可走。

# 端口 1：本机全能力端口（开发机常用）
[[listen]]
addr  = "127.0.0.1:1729"
allow = ["*"]

# 端口 2：管理面专用回环端口（可选）
# [[listen]]
# addr  = "127.0.0.1:1732"
# allow = ["*"]
# webui = true

# 端口 3：HTTP Git 端点（可选）
# [[listen]]
# addr  = "0.0.0.0:1730"
# allow = ["git-upload-pack"]

# 端口 4：允许把外部历史推进来（只接受快进，非快进一律拒绝）
# [[listen]]
# addr  = "0.0.0.0:1731"
# allow = ["git-upload-pack", "git-receive-pack"]

# 端口 5：受限只读 MCP 端口（给非受信网络）
# [[listen]]
# addr    = "10.10.0.0:1731"
# allow   = ["read", "ls", "recall", "grep", "log", "status"]
# require = "bearer"

# ── 用户声明 ──────────────────────────────────────────────────

[[user]]
name = "zero"
root = true

[[user]]
name   = "chat"
groups = ["agents"]

[[group]]
name    = "agents"
members = ["chat"]

# ── 项目声明（归属与默认权限）──────────────────────────────────
#
# 权限归项目，不归文件：
# 声明 Owner、Group 与 Unix 风格的 mode（rwxrwxrwx）

[[project]]
name  = "blackegg/me"
owner = "zero"
mode  = "rwx------"

[[project]]
name  = "blackegg/daily"
owner = "zero"
mode  = "rwx------"

# ── 显式授权规则 ──────────────────────────────────────────────

[[access]]
user    = "chat"
project = "blackegg/daily"
perm    = "r"

# ── 远端与对等体声明 ────────────────────────────────────────────
#
# 两种远端形态：
#
#   1. 对等 zero-memcp 节点（URL 以 http(s):// 开头，不以 .git 结尾）：
#      走工作层直接同步（/sync/work/*），无需先 commit，两端实时可见。
#
#   2. 传统 Git 远端（GitHub、本地裸仓库、SSH）：
#      走 Git fetch/merge/push，需要先提交，同步前检查 pending 条数。
#
# 四条纪律：
#   • 不自动 push —— 除非显式配置 auto_sync = true
#   • 不隐式 commit —— 传统 Git 远端有未提交内容时 push 拒绝并说明条数
#   • 不强推 —— 记忆历史只追加
#   • 冲突不静默 —— 分叉或并发删除时保留现场并报错，status 点名
#
# url 里不能内嵌密码，凭证名指向服务端密钥库。
# push 是分支白名单；空表示不可推；auto_sync 决定是否进后台同步循环。

# 对等节点（例：中心 hub 3060）
# [[remote]]
# project    = "blackegg/daily"
# name       = "hub"
# url        = "http://10.10.10.12:1729"
# push       = ["zero", "main.shared"]
# pull       = ["zero", "main.shared"]  # 下游主动拉上游；不写则默认与 push 一致
# auto_sync  = true                     # 必须为 true 才会进后台推拉循环
# http_token = "hub-token"              # 用 remote-secret put 写入服务端的 token 名

# 传统 Git 远端（例：GitHub 备份）
# [[remote]]
# project    = "blackegg/daily"
# name       = "github"
# url        = "git@github.com:private/daily.git"
# push       = ["main", "chat"]
# fetch_only = false
# auto_sync  = false
# ssh_key    = "github-deploy" # root 用 remote-key put 添加的私钥名
# host_key   = "SHA256:..."    # SSH host key fingerprint 必须显式 pin
